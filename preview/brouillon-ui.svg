<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <style>
      .serverBar { fill: #1e1f22; }
      .channelList { fill: #2b2d31; }
      .chatBg { fill: #313338; }
      .inputBg { fill: #383a40; }
      .divider { fill: #3f4147; }
      .red { fill: #ff2a2a; }
      .bg { fill: #000000; }
      .label { fill: #5c6069; font: 11px -apple-system, "SF Pro Text", system-ui, sans-serif; }
    </style>
  </defs>

  <!-- fond global -->
  <rect class="bg" width="1280" height="760"/>

  <!-- Col 1 — barre serveurs (72px) -->
  <rect class="serverBar" x="0" y="0" width="72" height="760"/>
  <!-- 6 icônes serveur placeholders (48x48, gap 8, top 12) -->
  <g>
    <rect class="red" x="12" y="12"  width="48" height="48" rx="12"/>
    <rect class="red" x="12" y="68"  width="48" height="48" rx="12"/>
    <rect class="red" x="12" y="124" width="48" height="48" rx="12"/>
    <rect class="red" x="12" y="180" width="48" height="48" rx="12"/>
    <rect class="red" x="12" y="236" width="48" height="48" rx="12"/>
    <rect class="red" x="12" y="292" width="48" height="48" rx="12"/>
  </g>

  <!-- Col 2 — liste channels (240px) -->
  <rect class="channelList" x="72" y="0" width="240" height="760"/>
  <!-- header de colonne (48px) -->
  <rect class="divider" x="72" y="47" width="240" height="1"/>
  <!-- barre profil en bas (56px) -->
  <rect class="inputBg" x="72" y="704" width="240" height="56"/>

  <!-- Col 3 — chat -->
  <rect class="chatBg" x="312" y="0" width="968" height="760"/>
  <!-- header du channel (48px) -->
  <rect class="divider" x="312" y="47" width="968" height="1"/>
  <!-- trait rouge de calage -->
  <rect class="red" x="472" y="10" width="1" height="28"/>
  <!-- barre de saisie (56px, marges 16) -->
  <rect class="inputBg" x="328" y="692" width="936" height="56" rx="8"/>

  <!-- légende discrète -->
  <text class="label" x="1268" y="752" text-anchor="end">Mood — brouillon UI (calage Figma). Carrés rouges = placeholders icônes serveur.</text>
</svg>
