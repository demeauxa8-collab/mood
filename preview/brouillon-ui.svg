<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #000; }
      .serverBar { fill: #1e1f22; }
      .channelList { fill: #2b2d31; }
      .chatBg { fill: #313338; }
      .inputBg { fill: #383a40; }
      .divider { fill: #3f4147; }
      .hoverBg { fill: #2e3035; }
      .selectedBg { fill: rgba(255,255,255,0.08); }
      .text { fill: #f5f5f7; }
      .textSec { fill: #949ba4; }
      .textMuted { fill: #5c6069; }
      .accent { fill: #6e56cf; }
      .online { fill: #23a55a; }
      .idle { fill: #f0b232; }
      .dnd { fill: #da373c; }
      .mention { fill: #da373c; }
    </style>
  </defs>

  <!-- Fond -->
  <rect class="bg" width="1440" height="900"/>

  <!-- ─────────────────────────── -->
  <!-- COL 1 — Barre serveurs 72px -->
  <!-- ─────────────────────────── -->
  <rect class="serverBar" x="0" y="0" width="72" height="900"/>

  <!-- Home (sélectionné) -->
  <rect class="accent" x="12" y="12" width="48" height="48" rx="14"/>
  <text x="36" y="44" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">M</text>
  <rect x="0" y="20" width="4" height="40" rx="2" fill="#fff"/>

  <!-- Divider -->
  <rect class="divider" x="20" y="72" width="32" height="2" rx="1"/>

  <!-- Autres serveurs -->
  <rect x="12" y="84"  width="48" height="48" rx="16" fill="#5865f2"/>
  <text x="36" y="115" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">DV</text>

  <rect x="12" y="140" width="48" height="48" rx="16" fill="#eb459e"/>
  <text x="36" y="172" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">★</text>

  <rect x="12" y="196" width="48" height="48" rx="16" fill="#57f287"/>
  <text x="36" y="227" fill="#000" font-size="14" font-weight="700" text-anchor="middle">GG</text>

  <rect x="12" y="252" width="48" height="48" rx="16" fill="#fee75c"/>
  <text x="36" y="283" fill="#000" font-size="14" font-weight="700" text-anchor="middle">JS</text>

  <rect x="12" y="308" width="48" height="48" rx="16" fill="#ed4245"/>
  <text x="36" y="339" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">RP</text>

  <!-- + ajouter serveur -->
  <rect class="chatBg" x="12" y="364" width="48" height="48" rx="16"/>
  <text x="36" y="397" fill="#23a55a" font-size="26" font-weight="300" text-anchor="middle">+</text>

  <!-- ─────────────────────────────── -->
  <!-- COL 2 — Liste channels 240px    -->
  <!-- ─────────────────────────────── -->
  <rect class="channelList" x="72" y="0" width="240" height="900"/>

  <!-- Header serveur -->
  <text x="88" y="30" class="text" font-size="15" font-weight="600">Mood — Équipe</text>
  <text x="296" y="30" class="textSec" font-size="18" text-anchor="end">⌄</text>
  <rect fill="#1e1f22" x="72" y="47" width="240" height="1"/>

  <!-- Catégorie INFORMATION -->
  <text x="88" y="78" class="textSec" font-size="11" font-weight="700">⌄ INFORMATION</text>
  <text x="100" y="102" class="textSec" font-size="14"># annonces</text>
  <text x="100" y="126" class="textSec" font-size="14"># règles</text>

  <!-- Catégorie DISCUSSION -->
  <text x="88" y="158" class="textSec" font-size="11" font-weight="700">⌄ DISCUSSION</text>

  <!-- # général sélectionné -->
  <rect class="selectedBg" x="80" y="170" width="224" height="28" rx="4"/>
  <text x="100" y="188" class="text" font-size="14"># général</text>

  <!-- # dev + badge -->
  <text x="100" y="212" class="textSec" font-size="14"># dev</text>
  <rect class="mention" x="270" y="200" width="26" height="16" rx="8"/>
  <text x="283" y="212" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>

  <text x="100" y="236" class="textSec" font-size="14"># design</text>

  <!-- # memes + badge -->
  <text x="100" y="260" class="textSec" font-size="14"># memes</text>
  <rect class="mention" x="262" y="248" width="34" height="16" rx="8"/>
  <text x="279" y="260" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">12</text>

  <!-- Catégorie VOCAL -->
  <text x="88" y="292" class="textSec" font-size="11" font-weight="700">⌄ VOCAL</text>
  <text x="100" y="316" class="textSec" font-size="14">🔊 Salon vocal</text>
  <text x="100" y="340" class="textSec" font-size="14">🔊 Stand-up</text>

  <!-- Barre profil -->
  <rect class="inputBg" x="72" y="844" width="240" height="56"/>
  <circle class="accent" cx="96" cy="872" r="16"/>
  <text x="96" y="877" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <circle class="online" cx="106" cy="882" r="5"/>
  <circle fill="#383a40" cx="106" cy="882" r="6.5" fill-opacity="0"/>
  <text x="120" y="868" class="text" font-size="13" font-weight="600">adm</text>
  <text x="120" y="884" class="textSec" font-size="11">@adm:matrix.org</text>
  <text x="232" y="877" class="textSec" font-size="13">🎙</text>
  <text x="258" y="877" class="textSec" font-size="13">🎧</text>
  <text x="284" y="877" class="textSec" font-size="13">⚙</text>

  <!-- ───────────────────────────── -->
  <!-- COL 3 — Chat (flex)            -->
  <!-- ───────────────────────────── -->
  <rect class="chatBg" x="312" y="0" width="888" height="900"/>

  <!-- Chat header -->
  <text x="328" y="32" class="textSec" font-size="22">#</text>
  <text x="348" y="30" class="text" font-size="15" font-weight="600">général</text>
  <rect class="divider" x="412" y="14" width="1" height="22"/>
  <text x="424" y="30" class="textSec" font-size="13">Discussions générales de l'équipe Mood</text>

  <!-- Actions header (droite) -->
