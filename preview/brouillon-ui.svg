  <text x="600" y="76" class="textSec" font-size="12" text-anchor="middle">19 mai 2026</text>
  <line x1="660" y1="72" x2="1184" y2="72" stroke="#3f4147" stroke-width="1"/>

  <!-- Message 1 : léo -->
  <circle cx="348" cy="116" r="20" fill="#5865f2"/>
  <text x="348" y="122" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">L</text>
  <text x="380" y="112" font-size="15" font-weight="600" fill="#5865f2">léo</text>
  <text x="418" y="112" class="textSec" font-size="11">aujourd'hui à 09:12</text>
  <text x="380" y="132" class="text" font-size="14">Salut tout le monde, j'ai poussé le brouillon de l'UI sur la branche</text>
  <rect fill="#1e1f22" x="380" y="142" width="240" height="20" rx="3"/>
  <text x="386" y="156" class="text" font-size="12" font-family="ui-monospace, Menlo, monospace">claude/connect-figma-0fOzY</text>
  <text x="630" y="156" class="text" font-size="14">🎨</text>

  <!-- Suite (compact) -->
  <text x="380" y="184" class="text" font-size="14">Le calage suit la frame Figma "Mood — UI Discord Calage"</text>
  <text x="356" y="184" class="textMuted" font-size="10">09:12</text>

  <!-- Message 2 : manon -->
  <circle cx="348" cy="224" r="20" fill="#eb459e"/>
  <text x="348" y="230" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">M</text>
  <text x="380" y="220" font-size="15" font-weight="600" fill="#eb459e">manon</text>
  <text x="430" y="220" class="textSec" font-size="11">aujourd'hui à 09:18</text>
  <text x="380" y="240" class="text" font-size="14">Top, j'ouvre la PR. Faut juste remplacer les carrés rouges par les icônes serveurs.</text>
  <!-- Réactions -->
  <rect fill="rgba(110,86,207,0.15)" stroke="#6e56cf" x="380" y="252" width="48" height="22" rx="11"/>
  <text x="404" y="267" class="text" font-size="12" text-anchor="middle">👍 2</text>
  <rect fill="#1e1f22" stroke="#3f4147" x="436" y="252" width="48" height="22" rx="11"/>
  <text x="460" y="267" class="textSec" font-size="12" text-anchor="middle">🔥 1</text>

  <!-- Message 3 : tom -->
  <circle cx="348" cy="316" r="20" fill="#23a55a"/>
  <text x="348" y="322" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">T</text>
  <text x="380" y="312" font-size="15" font-weight="600" fill="#23a55a">tom</text>
  <text x="412" y="312" class="textSec" font-size="11">aujourd'hui à 09:24</text>
  <text x="380" y="332" class="text" font-size="14">@adm tu peux ajouter la liste des membres à droite stp ? Sinon LGTM 👌</text>

  <!-- Message 4 : adm -->
  <circle cx="348" cy="384" r="20" fill="#6e56cf"/>
  <text x="348" y="390" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">A</text>
  <text x="380" y="380" font-size="15" font-weight="600" fill="#6e56cf">adm</text>
  <text x="416" y="380" class="textSec" font-size="11">aujourd'hui à 09:31</text>
  <text x="380" y="400" class="text" font-size="14">Fait. La col 4 est là, 240px, avec online/offline et statuts.</text>

  <!-- Barre saisie -->
  <rect class="inputBg" x="328" y="832" width="856" height="44" rx="8"/>
  <text x="348" y="860" class="textSec" font-size="22">＋</text>
  <text x="380" y="860" class="textMuted" font-size="14">Envoyer un message dans #général</text>
  <text x="1108" y="860" class="textSec" font-size="14">🎁</text>
  <text x="1132" y="860" class="textSec" font-size="12">GIF</text>
  <text x="1162" y="860" class="textSec" font-size="14">😀</text>

  <!-- ───────────────────────────── -->
  <!-- COL 4 — Membres 240px           -->
  <!-- ───────────────────────────── -->
  <rect class="channelList" x="1200" y="0" width="240" height="900"/>

  <text x="1216" y="36" class="textSec" font-size="11" font-weight="700">EN LIGNE — 4</text>

  <!-- adm -->
  <circle cx="1232" cy="64" r="16" fill="#6e56cf"/>
  <text x="1232" y="69" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <circle class="online" cx="1242" cy="74" r="5"/>
  <text x="1256" y="69" class="text" font-size="14" font-weight="500">adm</text>

  <!-- léo -->
  <circle cx="1232" cy="100" r="16" fill="#5865f2"/>
  <text x="1232" y="105" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">L</text>
  <circle class="online" cx="1242" cy="110" r="5"/>
  <text x="1256" y="105" class="text" font-size="14" font-weight="500">léo</text>

  <!-- manon (dnd) -->
  <circle cx="1232" cy="136" r="16" fill="#eb459e"/>
  <text x="1232" y="141" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">M</text>
  <circle class="dnd" cx="1242" cy="146" r="5"/>
  <text x="1256" y="141" class="text" font-size="14" font-weight="500">manon</text>

  <!-- jules (idle) -->
  <circle cx="1232" cy="172" r="16" fill="#fee75c"/>
  <text x="1232" y="177" fill="#000" font-size="13" font-weight="700" text-anchor="middle">J</text>
  <circle class="idle" cx="1242" cy="182" r="5"/>
  <text x="1256" y="177" class="text" font-size="14" font-weight="500">jules</text>

  <!-- HORS LIGNE -->
  <text x="1216" y="220" class="textSec" font-size="11" font-weight="700">HORS LIGNE — 3</text>

  <circle cx="1232" cy="248" r="16" fill="#4f545c"/>
  <text x="1232" y="253" fill="#dbdee1" font-size="13" font-weight="700" text-anchor="middle">T</text>
  <text x="1256" y="253" class="textMuted" font-size="14" font-weight="500">tom</text>

  <circle cx="1232" cy="284" r="16" fill="#4f545c"/>
  <text x="1232" y="289" fill="#dbdee1" font-size="13" font-weight="700" text-anchor="middle">N</text>
  <text x="1256" y="289" class="textMuted" font-size="14" font-weight="500">nora</text>

  <circle cx="1232" cy="320" r="16" fill="#4f545c"/>
  <text x="1232" y="325" fill="#dbdee1" font-size="13" font-weight="700" text-anchor="middle">S</text>
  <text x="1256" y="325" class="textMuted" font-size="14" font-weight="500">sami</text>
</svg>
